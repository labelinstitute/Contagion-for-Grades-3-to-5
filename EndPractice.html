{{ extends 'otree/Page.html' }}
{{ load static }}

{{ block content }}

<style>
  body, .otree-body, .container { background:#ffffff !important; }

  .card-wrap{
    max-width: 760px;
    margin: 40px auto 0 auto;
    padding: 28px 30px;
    border: 1px solid #e9e9e9;
    border-radius: 18px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    text-align: center;
  }

  .big{
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 10px;
    letter-spacing: 0.2px;
  }

  .sub{
    font-size: 18px;
    line-height: 1.5;
    color: #333;
    margin: 0 auto 18px auto;
    max-width: 640px;
  }

  .pill{
    display: inline-block;
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 999px;
    background: #f6f7f9;
    border: 1px solid #e9e9e9;
    font-size: 14px;
    color: #444;
  }

  .btn-wrap{
    margin-top: 26px;
    display: flex;
    justify-content: center;
  }

  .btn-wrap .btn{
    min-width: 200px;
    font-size: 18px;
    padding: 10px 18px;
    border-radius: 14px;
  }
